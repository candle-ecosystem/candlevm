name: CandleVM Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string
      publish_crate:
        description: "Publish to crates.io"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-x86_64
            runner: macos-15-intel
            binary: candlevm

          - target: macos-aarch64
            runner: macos-15
            binary: candlevm

          - target: linux-x86_64-glibc
            runner: ubuntu-24.04
            binary: candlevm

          - target: linux-aarch64-glibc
            runner: ubuntu-24.04-arm
            binary: candlevm

          - target: linux-x86_64-musl
            runner: ubuntu-24.04
            binary: candlevm

          - target: linux-aarch64-musl
            runner: ubuntu-24.04-arm
            binary: candlevm

          - target: windows-x86_64
            runner: windows-2025
            binary: candlevm.exe

          - target: windows-aarch64
            runner: windows-11-arm
            binary: candlevm.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify version matches tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"

          CARGO_VERSION=$(python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("Cargo.toml").open("rb") as f:
              cargo = tomllib.load(f)

          print(cargo["package"]["version"])
          PY
          )

          if [[ "$RELEASE_TAG" != v* || "$TAG_VERSION" != "$CARGO_VERSION" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

          echo "Version verified: $RELEASE_TAG"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Configure Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add "$(uname -m)-unknown-linux-musl"

      - name: Build CandleVM
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *-musl ]]; then
            ARCH="$(uname -m)"
            RUST_TARGET="${ARCH}-unknown-linux-musl"

            RUSTFLAGS="-C linker=musl-gcc" \
              cargo build --release --locked --target "$RUST_TARGET"
          else
            cargo build --release --locked
          fi

      - name: Verify static musl linkage
        if: endsWith(matrix.target, '-musl')
        shell: bash
        run: |
          ARCH="$(uname -m)"
          BINARY="target/${ARCH}-unknown-linux-musl/release/candlevm"

          if readelf -l "$BINARY" | grep -q 'INTERP'; then
            echo "::error::CandleVM contains a dynamic interpreter"
            exit 1
          fi

          if readelf -d "$BINARY" 2>/dev/null | grep -q '(NEEDED)'; then
            echo "::error::CandleVM has dynamic library dependencies"
            exit 1
          fi

          echo "CandleVM is statically linked."

      - name: Package ZIP
        shell: bash
        env:
          BINARY_NAME: ${{ matrix.binary }}
          TARGET_NAME: ${{ matrix.target }}
          VERSION: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os
          import platform
          import zipfile
          from pathlib import Path

          root = Path.cwd()
          target = os.environ["TARGET_NAME"]

          if target.endswith("-musl"):
              arch = platform.machine()
              binary = (
                  root / "target"
                  / f"{arch}-unknown-linux-musl"
                  / "release"
                  / os.environ["BINARY_NAME"]
              )
          else:
              binary = (
                  root / "target" / "release"
                  / os.environ["BINARY_NAME"]
              )

          dist = root / "dist"
          dist.mkdir(exist_ok=True)

          if not binary.is_file():
              raise SystemExit(f"Build output not found: {binary}")

          archive = dist / (
              f"candlevm-{os.environ['VERSION']}-"
              f"{target}.zip"
          )

          files = [binary, root / "LICENSE", root / "README.md"]

          with zipfile.ZipFile(
              archive, "w", compression=zipfile.ZIP_DEFLATED
          ) as zf:
              for file in files:
                  if file.is_file():
                      zf.write(file, file.name)

          print(f"Created {archive}")
          PY

      - name: Upload build archive
        uses: actions/upload-artifact@v4
        with:
          name: candlevm-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: candlevm-*
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum *.zip > SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            release-assets/*.zip
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true

  publish-crate:
    name: Publish to crates.io
    needs: build
    if: inputs.publish_crate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Publish to crates.io
        run: cargo publish --locked --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
